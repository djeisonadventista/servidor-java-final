server.port = ${PORT:8080}

spring.application.name=servidorlocal


spring.datasource.url=${DB_URL:jdbc:h2:file:./data/servidorlocal}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.max-http-header-size=128KB
server.tomcat.max-http-form-post-size=2MB


